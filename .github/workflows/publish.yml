name: Stage npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm install --global corepack@0.36.0 --ignore-scripts
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn release:pack
      - name: Upload release tarballs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_attempt }}
          path: |
            .release/core.tgz
            .release/browser.tgz
            .release/node.tgz
          # Only the three explicit tarballs above; .release is a hidden directory.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # This fresh runner only handles tarballs: no checkout or project scripts.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .release
          merge-multiple: true
      - name: Check all release tarballs are present
        run: |
          test -s .release/core.tgz
          test -s .release/browser.tgz
          test -s .release/node.tgz
      - name: Stage packages for maintainer approval
        run: |
          npm stage publish .release/core.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org/
          npm stage publish .release/browser.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org/
          npm stage publish .release/node.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org/
